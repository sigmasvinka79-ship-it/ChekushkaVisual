name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          mkdir -p proj
          unzip -o ./*.zip -d proj
          D=$(dirname "$(find proj -name build.gradle | head -n 1)")
          echo "PROJ=$D" >> "$GITHUB_ENV"
          grep -rl "import net.minecraft.Util;" "$D/src" | xargs -r sed -i 's/import net.minecraft.Util;/import net.minecraft.util.Util;/'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Build
        run: |
          cd "$PROJ"
          gradle build --no-daemon > build.log 2>&1 || {
            echo "===== ERRORS ====="
            grep -h -A2 "error:" build.log | sed 's#.*/src/main/java/##' | head -80
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-jar
          path: ${{ env.PROJ }}/build/libs/*.jar
